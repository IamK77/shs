name: test

on:
    # push:
    #     tags:
    #         - 'v*'
    workflow_dispatch:

env:
    EXECUTABLE: "shs"
    SET_WORKSPACE: "./rust"   # default value is "."

jobs:
    build:
      runs-on: ${{ matrix.config.os }}
      strategy:
        matrix:
          config:
            - {os: macos-latest}
            - {os: ubuntu-latest}
            - {os: windows-latest}
      steps:
        - uses: actions/checkout@v4
        - name: Install Rust
          uses: dtolnay/rust-toolchain@stable
        - name: Build
          run: |
            cd ${{ env.SET_WORKSPACE }}
            cargo build --release
        - name: Run tests
          run: |
            cd ${{ env.SET_WORKSPACE }}
            cargo test
        - name: Upload artifact
          uses: actions/upload-artifact@v4
          with:
            name: ${{ env.EXECUTABLE }}-${{ matrix.config.os }}
            path: ./rust/target/release/${{ env.EXECUTABLE }}

    build_rust_macos:

      runs-on: macos-latest

      steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Build
        run: |
            cd rust
            cargo build --release
      - name: Run tests
        run: |
            cd rust
            cargo test

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.EXECUTABLE }}-macos
          path: ./rust/target/release/${{ env.EXECUTABLE }}

    build_rust_linux:

        runs-on: ubuntu-latest
    
        steps:
        - uses: actions/checkout@v4
        - name: Install Rust
          uses: dtolnay/rust-toolchain@stable
        - name: Build
          run: |
            cd rust
            cargo build --release
        - name: Run tests
          run: |
            cd rust
            cargo test
        - name: Upload artifact
          uses: actions/upload-artifact@v4
          with:
            name: ${{ env.EXECUTABLE }}-linux
            path: ./rust/target/release/${{ env.EXECUTABLE }}

    build_rust_windows:

        runs-on: windows-latest
    
        steps:
        - uses: actions/checkout@v4
        - name: Install Rust
          uses: dtolnay/rust-toolchain@stable
        - name: Build
          run: |
            cd rust
            cargo build --release
        - name: Run tests
          run: |
            cd rust
            cargo test
        - name: Upload artifact
          uses: actions/upload-artifact@v4
          with:
            name: ${{ env.EXECUTABLE }}-windows
            path: ./rust/target/release/${{ env.EXECUTABLE }}.exe

    release:
        needs: [build_rust_macos, build_rust_linux, build_rust_windows]
        runs-on: ubuntu-latest
        steps:
        # - name: Checkout code
        #   uses: actions/checkout@v2

        - name: Download Linux artifact
          uses: actions/download-artifact@v4
          env:
            GITHUB_TOKEN: ${{ secrets.MY_PAT }}
          with:
            name: ${{ env.EXECUTABLE }}-linux
            path: ./linux/${{ env.EXECUTABLE }}
    
        - name: Download Windows artifact
          uses: actions/download-artifact@v4
          env:
            GITHUB_TOKEN: ${{ secrets.MY_PAT }}
          with:
            name: ${{ env.EXECUTABLE }}-windows
            path: ./windows/${{ env.EXECUTABLE }}.exe
    
        - name: Download macOS artifact
          uses: actions/download-artifact@v4
          env:
            GITHUB_TOKEN: ${{ secrets.MY_PAT }}
          with:
            name: ${{ env.EXECUTABLE }}-macos
            path: ./macos/${{ env.EXECUTABLE }}


        - name: Create zip
          run: |
                sudo apt-get install zip
                zip ${{ env.EXECUTABLE }}_linux.zip ./linux/${{ env.EXECUTABLE }}
                zip ${{ env.EXECUTABLE }}_windows.zip ./windows/${{ env.EXECUTABLE }}.exe
                zip ${{ env.EXECUTABLE }}_macos.zip ./macos/${{ env.EXECUTABLE }}
          # working-directory: ./rust/target/release


        - name: Create Release
          id: create_release
          uses: softprops/action-gh-release@v2
          if: startsWith(github.ref, 'refs/tags/')
          env:
              GITHUB_TOKEN: ${{ secrets.MY_PAT }}
          with:
              files: |
                ${{ env.EXECUTABLE }}_linux.zip
                ${{ env.EXECUTABLE }}_windows.zip
                ${{ env.EXECUTABLE }}_macos.zip