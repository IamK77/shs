[package]
name = "shs"
version = "0.1.1"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
inquire = "0.7.0"
regex = "1.5.4"
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
clap = { version = "4.4", features = ["derive"] }
log = "0.4"
env_logger = "0.10"
which = "4.4"
tempfile = "3.8"
thiserror = "1.0"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
